  space1: {label: 空格, repeatable: false, functional: false, send: space}
  Return2: {label: 回车, send: Return}
  clipboard_window: {label: 剪贴, send: FUNCTION, command: clipboard_window, option: '0'}
  liquid_keyboard_switch: {label: 更多, send: FUNCTION, command: liquid_keyboard, option: "更多"}
  liquid_keyboard_exit: {label: 返回, send: FUNCTION, command: liquid_keyboard, option: "-1"}
  Tool_symbols: {label: 符号, send: FUNCTION, command: liquid_keyboard, option: "符号表"}
  Tool_emoji: {label: 表情, send: FUNCTION, command: liquid_keyboard, option: "emoji"}
  Tool_phrases: {label: 短语, send: FUNCTION, command: liquid_keyboard, option: "常用"}
  Tool_edit: {label: 编辑, send: FUNCTION, command: menu_keyboard}
  Tool_paste: {label: 粘贴, send: FUNCTION, command: clipboard}
  Tool_backspace: {label: ⌫, send: BackSpace}
  Keyboard_default: {send: Eisu_toggle, select: default}
  Keyboard_letter: {send: Eisu_toggle, select: letter}
  Keyboard_number: {send: Eisu_toggle, select: number}

liquid_keyboard:
  # 目前只能直接写参数，不支持变量或者fallback机制。
  # 缺少参数时，自动从style中加载参数。除非需要指定liquid_keyboard使用与主键盘不同的背景色、背景图，否则不应设置被注释掉的参数。
  author: "tumuyan"
  row: 6              #每屏最多显示多少行按键
  row_land: 5         #横屏每屏最多显示多少行按键
  key_height: 40      #按键高度
  key_height_land: 40 #横屏模式按键高度
  single_width: 60    #single类型的按键宽度
  vertical_gap: 1     #纵向按键间隙
  margin_x: 5         #左右按键间隙的1/2
  fixed_key_bar:  # 固定按键条
