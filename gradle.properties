# https://developer.android.com/build/optimize-your-build#disable-the-jetifier-flag
android.enableJetifier=false
android.useAndroidX=true

# enlarge heap size to 4GB
org.gradle.jvmargs=-Xmx4096M -XX:+HeapDumpOnOutOfMemoryError

# KSP2 https://github.com/google/ksp/blob/main/docs/ksp2.md
ksp.useKSP2=true

# Native ABIs built by default (keep in sync with abi splits).
# Override with -PbuildAbi=armeabi-v7a,arm64-v8a,x86,x86_64 for a universal build.
buildAbi=arm64-v8a,x86_64
